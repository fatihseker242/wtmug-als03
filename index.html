<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" id="theme-meta" content="#0b0f14">
<title>Hava Durumu</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<style>
:root{
  --bg:#0b0f14; --card:#161b22; --fg:#e6edf3; --muted:#8b98a5;
  --accent:#3b82f6; --border:#222;
}
html[data-theme="light"]{
  --bg:#f5f7fa; --card:#ffffff; --fg:#1f2937; --muted:#6b7280;
  --accent:#2563eb; --border:#e5e7eb;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,sans-serif;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
  transition:background .2s,color .2s}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:12px;width:100%;outline:none}
input:focus{border-color:var(--accent)}

.topbar{display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;
  background:var(--bg);z-index:5;gap:8px}
.topbar h1{font-size:16px;margin:0;flex:1}
.icon-btn{background:transparent;border:1px solid var(--border);border-radius:10px;
  padding:8px 10px;font-size:16px;min-width:42px}
.icon-btn:active{background:var(--card)}

.wrap{padding:16px;display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto}

.banner{background:#7c2d12;color:#fff;padding:10px 14px;border-radius:10px;
  font-size:13px;display:flex;gap:8px;align-items:center}
html[data-theme="light"] .banner{background:#fef3c7;color:#78350f}

.search{display:grid;grid-template-columns:1fr auto;gap:8px}
.btn{background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:12px;font-size:14px;min-height:44px;display:flex;align-items:center;
  justify-content:center;gap:6px}
.btn:active{background:var(--border)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.block{width:100%}

.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}
.current{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.current .temp{font-size:64px;font-weight:200;line-height:1;margin:8px 0 4px}
.current .emoji{font-size:56px}
.current .city{font-size:18px;font-weight:600}
.current .desc{color:var(--muted);font-size:14px}
.current .updated{color:var(--muted);font-size:12px;margin-top:4px}

.details{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.detail{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:12px;display:flex;flex-direction:column;gap:4px}
.detail .lbl{color:var(--muted);font-size:12px}
.detail .val{font-size:18px;font-weight:600}

.forecast-title{font-size:14px;color:var(--muted);margin:4px 0 0}
.forecast{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.day{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:4px}
.day .name{font-size:12px;color:var(--muted);text-transform:capitalize}
.day .emoji{font-size:26px}
.day .max{font-size:15px;font-weight:600}
.day .min{font-size:12px;color:var(--muted)}

.err{background:#3b1d1d;color:#fecaca;padding:10px 14px;border-radius:10px;font-size:13px}
html[data-theme="light"] .err{background:#fee2e2;color:#991b1b}

.mono{font-family:monospace;font-size:11px;color:var(--muted);text-align:center;
  padding:8px 0}
</style>
</head>
<body>

<header class="topbar">
  <h1>🌤️ Hava Durumu</h1>
  <button id="install-btn" class="icon-btn" hidden title="Yükle">⬇️</button>
  <button id="theme-btn" class="icon-btn" title="Tema">🌙</button>
</header>

<main class="wrap">

  <div id="offline" class="banner" hidden>
    ⚠️ Çevrimdışısın — son bilinen veriler gösteriliyor
  </div>

  <div class="search">
    <input id="city-input" type="text" placeholder="Şehir ara (örn. Ankara)" autocomplete="off">
    <button id="search-btn" class="btn primary">Ara</button>
  </div>

  <button id="geo-btn" class="btn block">📍 Konumumu Kullan</button>

  <div id="error" class="err" hidden></div>

  <div id="weather" hidden>
    <div class="card current">
      <div id="w-emoji" class="emoji">☀️</div>
      <div id="w-temp" class="temp">--°</div>
      <div id="w-city" class="city">--</div>
      <div id="w-desc" class="desc">--</div>
      <div id="w-updated" class="updated">--</div>
    </div>

    <div class="details" style="margin-top:14px">
      <div class="detail">
        <span class="lbl">💧 Nem</span>
        <span id="w-hum" class="val">--</span>
      </div>
      <div class="detail">
        <span class="lbl">🌬️ Rüzgâr</span>
        <span id="w-wind" class="val">--</span>
      </div>
      <div class="detail">
        <span class="lbl">🌡️ Hissedilen</span>
        <span id="w-feel" class="val">--</span>
      </div>
      <div class="detail">
        <span class="lbl">🌧️ Yağış</span>
        <span id="w-precip" class="val">--</span>
      </div>
    </div>

    <p class="forecast-title">📅 Günlük Tahmin</p>
    <div id="forecast" class="forecast"></div>

    <div id="w-src" class="mono">Veri: Open-Meteo</div>
  </div>

</main>

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };

/* ---------- WMO kod → açıklama + emoji ---------- */
var WMO = {
  0:['Açık','☀️'], 1:['Az bulutlu','🌤️'], 2:['Parçalı bulutlu','⛅'], 3:['Çok bulutlu','☁️'],
  45:['Sisli','🌫️'], 48:['Kırağılı sis','🌫️'],
  51:['Hafif çisenti','🌦️'], 53:['Çisenti','🌦️'], 55:['Yoğun çisenti','🌦️'],
  56:['Dondurucu çisenti','🌧️'], 57:['Yoğun dondurucu çisenti','🌧️'],
  61:['Hafif yağmur','🌧️'], 63:['Yağmur','🌧️'], 65:['Şiddetli yağmur','🌧️'],
  66:['Dondurucu yağmur','🌧️'], 67:['Şiddetli dondurucu yağmur','🌧️'],
  71:['Hafif kar','🌨️'], 73:['Kar','🌨️'], 75:['Yoğun kar','❄️'], 77:['Kar taneleri','❄️'],
  80:['Hafif sağanak','🌦️'], 81:['Sağanak','🌧️'], 82:['Şiddetli sağanak','⛈️'],
  85:['Hafif kar sağanağı','🌨️'], 86:['Yoğun kar sağanağı','❄️'],
  95:['Fırtına','⛈️'], 96:['Dolulu fırtına','⛈️'], 99:['Şiddetli fırtına','⛈️']
};
function wmo(c){ return WMO[c] || ['Bilinmiyor','❓']; }

/* ---------- Tema ---------- */
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  $('theme-btn').textContent = theme === 'dark' ? '🌙' : '☀️';
  var meta = $('theme-meta');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#0b0f14' : '#f5f7fa');
  try{ localStorage.setItem('theme', theme); }catch(_){}
}
(function initTheme(){
  var saved = null;
  try{ saved = localStorage.getItem('theme'); }catch(_){}
  var theme = saved || (window.matchMedia
    && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  applyTheme(theme);
})();
$('theme-btn').addEventListener('click', function(){
  var cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'dark' ? 'light' : 'dark');
});

/* ---------- Çevrimdışı uyarısı ---------- */
function updateOnline(){ $('offline').hidden = navigator.onLine; }
window.addEventListener('online', updateOnline);
window.addEventListener('offline', updateOnline);
updateOnline();

/* ---------- Hata göster ---------- */
function showError(msg){
  var el = $('error');
  el.textContent = msg;
  el.hidden = false;
  $('weather').hidden = true;
}
function clearError(){ $('error').hidden = true; }

/* ---------- API ---------- */
function geocode(name){
  var url = 'https://geocoding-api.open-meteo.com/v1/search?name='
          + encodeURIComponent(name) + '&count=1&language=tr&format=json';
  return fetch(url).then(function(r){ return r.json(); }).then(function(j){
    if (!j.results || !j.results.length) return null;
    var r = j.results[0];
    return {
      name: r.name + (r.admin1 ? ', ' + r.admin1 : '') + (r.country ? ' (' + r.country + ')' : ''),
      lat: r.latitude,
      lon: r.longitude
    };
  });
}
function fetchWeather(lat, lon){
  var url = 'https://api.open-meteo.com/v1/forecast'
    + '?latitude=' + lat + '&longitude=' + lon
    + '&current=temperature_2m,relative_humidity_2m,apparent_temperature,'
    + 'precipitation,weather_code,wind_speed_10m,wind_direction_10m'
    + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum'
    + '&timezone=auto&forecast_days=6&wind_speed_unit=kmh&temperature_unit=celsius';
  return fetch(url).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}

/* ---------- Yardımcılar ---------- */
function compassDir(deg){
  if (deg == null) return '';
  var d = ['K','KKD','KD','DKD','D','DGD','GD','GGD','G','GGB','GB','BGB','B','BKB','KB','KKB'];
  return d[Math.round(deg / 22.5) % 16];
}
function saveLastCity(placeName){
  if (!placeName || placeName.indexOf('Konumum') === 0) return;
  try{
    var clean = placeName.split(' (')[0].split(',')[0].trim();
    if (clean) localStorage.setItem('lastCity', clean);
  }catch(_){}
}

/* ---------- Render ---------- */
function render(data, placeName){
  var cur = data.current;
  var daily = data.daily;
  var info = wmo(cur.weather_code);

  $('w-emoji').textContent = info[1];
  $('w-temp').textContent = Math.round(cur.temperature_2m) + '°C';
  $('w-city').textContent = placeName;
  $('w-desc').textContent = info[0];
  $('w-hum').textContent = cur.relative_humidity_2m + '%';
  $('w-wind').textContent = Math.round(cur.wind_speed_10m) + ' km/s '
                          + compassDir(cur.wind_direction_10m);
  $('w-feel').textContent = Math.round(cur.apparent_temperature) + '°C';
  $('w-precip').textContent = (cur.precipitation != null ? cur.precipitation : 0) + ' mm';

  var now = new Date();
  var hh = String(now.getHours()).padStart(2,'0');
  var mm = String(now.getMinutes()).padStart(2,'0');
  $('w-updated').textContent = 'Son güncelleme: bugün ' + hh + ':' + mm;

  var fc = $('forecast');
  fc.innerHTML = '';
  var dayNames = ['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
  for (var i = 0; i < daily.time.length; i++){
    var d = new Date(daily.time[i] + 'T12:00:00');
    var label = (i === 0) ? 'Bugün' : dayNames[d.getDay()];
    var di = wmo(daily.weather_code[i]);
    var el = document.createElement('div');
    el.className = 'day';
    el.innerHTML = '<div class="name">' + label + '</div>'
      + '<div class="emoji">' + di[1] + '</div>'
      + '<div class="max">' + Math.round(daily.temperature_2m_max[i]) + '°</div>'
      + '<div class="min">' + Math.round(daily.temperature_2m_min[i]) + '°</div>';
    fc.appendChild(el);
  }

  $('w-src').textContent = 'Veri: Open-Meteo · Konum: '
    + data.latitude.toFixed(2) + ', ' + data.longitude.toFixed(2);

  $('weather').hidden = false;
  saveLastCity(placeName);
}

/* ---------- Şehir ara ---------- */
function searchCity(name){
  if (!name){ showError('Şehir adı girin'); return; }
  clearError();
  $('weather').hidden = true;
  if (!navigator.onLine){ showError('İnternet bağlantısı yok'); return; }
  geocode(name).then(function(place){
    if (!place){
      showError('"' + name + '" bulunamadı. Farklı bir isim deneyin.');
      return;
    }
    return fetchWeather(place.lat, place.lon).then(function(data){
      render(data, place.name);
    });
  }).catch(function(err){
    showError('Bağlantı hatası: ' + (err.message || err));
  });
}

/* ---------- Konum al (DÜZELTİLDİ) ---------- */
function useLocation(){
  clearError();

  if (!navigator.geolocation){
    showError('Bu tarayıcı konum desteklemiyor');
    return;
  }
  if (!navigator.onLine){
    showError('İnternet bağlantısı yok. Hava verisi alınamaz.');
    return;
  }

  $('weather').hidden = true;
  $('geo-btn').disabled = true;
  $('geo-btn').textContent = '📍 Konum alınıyor…';

  var done = false;
  var timeoutId = setTimeout(function(){
    if (done) return;
    done = true;
    $('geo-btn').disabled = false;
    $('geo-btn').textContent = '📍 Konumumu Kullan';
    showError('Konum alınamadı (zaman aşımı). GPS açık mı? Açık alanda deneyin.');
  }, 25000);

  navigator.geolocation.getCurrentPosition(
    function(pos){
      if (done) return;
      done = true;
      clearTimeout(timeoutId);
      $('geo-btn').disabled = false;
      $('geo-btn').textContent = '📍 Konumumu Kullan';

      var lat = pos.coords.latitude;
      var lon = pos.coords.longitude;

      fetchWeather(lat, lon).then(function(data){
        render(data, 'Konumum (' + lat.toFixed(2) + ', ' + lon.toFixed(2) + ')');
      }).catch(function(err){
        showError('Hava verisi alınamadı: ' + (err.message || err));
      });
    },
    function(err){
      if (done) return;
      done = true;
      clearTimeout(timeoutId);
      $('geo-btn').disabled = false;
      $('geo-btn').textContent = '📍 Konumumu Kullan';

      var msg;
      if (err.code === 1){
        msg = 'Konum izni reddedildi. Tarayıcı ayarlarından izin verin: Kilit → İzinler → Konum → İzin Ver';
      } else if (err.code === 2){
        msg = 'Konum alınamadı. Cihazın konum servisi açık mı? (Ayarlar → Konum)';
      } else if (err.code === 3){
        msg = 'Konum zaman aşımı. Açık alanda tekrar deneyin.';
      } else {
        msg = 'Konum hatası: ' + (err.message || 'bilinmeyen');
      }
      showError(msg);
    },
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 30000 }
  );
}

/* ---------- Olaylar ---------- */
$('search-btn').addEventListener('click', function(){
  searchCity($('city-input').value.trim());
});
$('city-input').addEventListener('keydown', function(e){
  if (e.key === 'Enter') searchCity($('city-input').value.trim());
});
$('geo-btn').addEventListener('click', useLocation);

/* ---------- PWA install ---------- */
var installPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  installPrompt = e;
  $('install-btn').hidden = false;
});
$('install-btn').addEventListener('click', function(){
  if (!installPrompt) return;
  installPrompt.prompt();
  installPrompt.userChoice.then(function(){
    installPrompt = null;
    $('install-btn').hidden = true;
  });
});

/* ---------- Service Worker ---------- */
if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./service-worker.js').catch(function(e){
      console.warn('SW kayıt hatası:', e);
    });
  });
}

/* ---------- Başlangıç ---------- */
(function startup(){
  var lastCity = null;
  try{ lastCity = localStorage.getItem('lastCity'); }catch(_){}
  var initial = lastCity || 'Ankara';
  $('city-input').value = initial;
  searchCity(initial);
})();

})();
</script>
</body>
</html>
